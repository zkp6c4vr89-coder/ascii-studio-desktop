<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'">
  <title>ASCII Studio live wallpaper</title>
  <link rel="stylesheet" href="../web/customise.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #f4f3f8; -webkit-font-smoothing: antialiased; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="out"></canvas>
  <div class="clock" id="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  <div class="snap-line" id="snap-line"></div>
  <script type="module" src="live.js"></script>
</body>
</html>
