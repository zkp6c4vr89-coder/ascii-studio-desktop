# Builds the installers on GitHub's own Mac, Windows and Linux machines.
#  - Push a tag like v1.0.0   -> builds everything and publishes a GitHub Release with the files
#  - "Run workflow" button    -> builds everything and keeps the files as downloadable artifacts
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        run: node scripts/check-version.js
        env:
          GITHUB_REF_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no paid signing certificate; see README

      - name: Sign installers for the auto-updater
        run: node scripts/sign-release.js dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.sig
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Download
            | System | File |
            |---|---|
            | macOS (Apple Silicon: M1, M2, M3, M4…) | `ASCII-Studio-*-mac-arm64.dmg` |
            | macOS (Intel) | `ASCII-Studio-*-mac-x64.dmg` |
            | Windows 10/11 | `ASCII-Studio-*-win-x64.exe` |
            | Linux (any distro) | `ASCII-Studio-*-linux-x86_64.AppImage` |
            | Debian / Ubuntu | `ASCII-Studio-*-linux-amd64.deb` |

            These builds aren't signed with a paid certificate, so your computer will warn you the
            first time. See **Installing** in the README for the one-time steps. After that, the app
            updates itself: every installer here has a `.sig` signature it checks before installing.

            > Tested on macOS. The Windows and Linux builds are built automatically but haven't been
            > tested on real machines yet; if something's off, please open an issue.
